<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P3B NAMUR - LIVE</title>
    <link rel="stylesheet" href="./style.css?v=60">
</head>
<body>
    <div class="container">
        <h1 class="main-title">P3B NAMUR - LIVE</h1>
        
        <div class="navigation-journee">
            <button id="btn-prev" class="btn-nav">Préc.</button>
            <div class="infos-centre">
                <h2 id="titre-classement">Journée 1</h2>
                <span class="date-matchs">22-23/08/26</span>
            </div>
            <button id="btn-next" class="btn-nav">Suiv.</button>
        </div>

        <div class="zone-matchs">
            <div id="corps-matchs"></div>
        </div>

        <div class="onglets-tranches">
            <button class="tab-btn active" onclick="changerOnglet('general')">Général</button>
            <button class="tab-btn" onclick="changerOnglet('t1')">Tranche 1</button>
            <button class="tab-btn" onclick="changerOnglet('t2')">Tranche 2</button>
            <button class="tab-btn" onclick="changerOnglet('t3')">Tranche 3</button>
        </div>

        <div class="zone-classement">
            <h3 id="titre-classement-tab" style="color: #00ff66; margin-top: 20px; text-align: center;">Classement Général</h3>
            <table class="classement-table">
                <thead>
                    <tr>
                        <th>Pl</th>
                        <th style="text-align:left;">Équipe</th>
                        <th>J</th>
                        <th>G</th>
                        <th>+/-</th>
                        <th style="color: #00ffff;">Pts</th>
                    </tr>
                </thead>
                <tbody id="corps-classement"></tbody>
            </table>
        </div>
    </div>
    <script src="./script.js?v=60"></script>
</body>
</html>
